[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceclass-agent"
version = "0.1.0"
description = "A traceable classroom evidence analysis agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2.0",
  "celery>=5.4,<6.0",
  "fastapi>=0.115,<1.0",
  "langgraph>=1.0,<2.0",
  "minio>=7.2,<8.0",
  "openai>=2.0,<3.0",
  "pgvector>=0.3,<1.0",
  "psycopg[binary]>=3.1,<4.0",
  "pypdf>=6.0,<7.0",
  "pydantic>=2.0,<3.0",
  "redis>=5.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0"
]

[project.scripts]
evidenceclass = "packages.evidence_engine.cli:main"

[project.optional-dependencies]
local-qwen = [
  "accelerate>=1.1,<2.0",
  "torch>=2.4",
  "transformers[vision]>=5.14,<6.0"
]
media-models = [
  "faster-whisper>=1.1,<2.0",
  "pillow>=10.0,<13.0",
  "rapidocr-onnxruntime>=1.4,<2.0"
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "hypothesis>=6.0,<7.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.6,<1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.*", "packages.*"]
namespaces = true

[tool.setuptools.package-data]
"packages.persistence.migrations" = ["README", "script.py.mako"]
"packages.model_gateway" = ["fixtures/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["packages/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
