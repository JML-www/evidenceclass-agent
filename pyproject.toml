[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceclass-agent"
version = "0.1.0"
description = "A traceable classroom evidence analysis agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "hypothesis>=6.0,<7.0",
  "ruff>=0.6,<1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.*", "packages.*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
