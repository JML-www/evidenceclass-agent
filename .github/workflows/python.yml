name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 - Ruff and Pytest
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js 24 for media tool bootstrap
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: ./scripts/setup-media-tools.ps1

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Pytest
        run: python -m pytest -q

  phase-3-infrastructure:
    name: Phase 3/6 - Infrastructure and pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: evidenceclass_ci
          POSTGRES_USER: evidenceclass_ci
          POSTGRES_PASSWORD: evidenceclass_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceclass_ci -d evidenceclass_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://evidenceclass_ci:evidenceclass_ci_password@127.0.0.1:5432/evidenceclass_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: evidenceclass-ci
      MINIO_SECRET_KEY: evidenceclass-ci-secret
      MINIO_BUCKET: evidenceclass-ci
      MINIO_SECURE: "false"
      RUN_STAGE3_INFRA_TESTS: "1"
      RUN_STAGE6_PGVECTOR_TESTS: "1"
      RUN_STAGE8_CELERY_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Start MinIO
        shell: bash
        run: |
          # Upstream MinIO ended community container distribution in October 2025, so
          # minio/minio no longer resolves on Docker Hub or Quay. Use maintained,
          # wire-compatible replacements: pgsty/silo keeps the MINIO_* variables, the
          # /minio/* health routes, the on-disk format and the `server /data` entrypoint.
          # The pinned release is tried first, with vendor-diverse fallbacks so a future
          # tag removal cannot break this job the way minio/minio did.
          images=(
            "pgsty/silo:RELEASE.2026-09-03T13-18-01Z"
            "pgsty/silo:latest"
            "cgr.dev/chainguard/minio:latest"
          )
          # An explicit, world-writable data directory keeps every candidate image
          # working whether it runs the server as root or as an unprivileged user.
          data_dir="${RUNNER_TEMP:-/tmp}/evidenceclass-minio"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          chmod 0777 "$data_dir"
          for image in "${images[@]}"; do
            echo "Starting object storage from ${image}"
            docker rm -f evidenceclass-minio >/dev/null 2>&1 || true
            if ! docker run -d --name evidenceclass-minio \
              -p 9000:9000 \
              -v "$data_dir:/data" \
              -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
              -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
              "$image" server /data; then
              echo "${image} could not be started; trying the next candidate."
              continue
            fi
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
                echo "Object storage is ready (${image})."
                exit 0
              fi
              sleep 2
            done
            echo "${image} never became healthy; trying the next candidate."
            docker logs evidenceclass-minio || true
          done
          echo "No MinIO-compatible image could be started." >&2
          exit 1

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run phase-3 infrastructure integration test
        run: python -m pytest tests/integration/test_stage3_infrastructure.py -q

      - name: Run phase-6 pgvector integration test
        run: python -m pytest tests/integration/test_stage6_pgvector.py -q

      - name: Run phase-8 Celery integration test
        run: python -m pytest tests/integration/test_stage8_celery.py -q
